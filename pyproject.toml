[project]
name = "orbiter"
version = "0.1.0"
description = "Distributed simulation orchestration platform: autoscaling worker fleet that survives chaos, measured not claimed"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Mark Pelico" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "asyncpg>=0.30",
    "nats-py>=2.9",
    "redis>=5.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "asgi-lifespan>=2.1",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
    "testcontainers>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orbiter"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]
python_version = "3.13"

[[tool.mypy.overrides]]
module = ["asyncpg.*", "nats.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not integration' -q"
markers = [
    "integration: needs real NATS/Postgres/Valkey via Docker (run with -m integration)",
]
