apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: orbiter
spec:
  selector:
    app: api
  ports:
    - port: 8000
# No LoadBalancer/Ingress on purpose: demos use `kubectl port-forward`, and
# load tests run in-cluster (no home-ISP noise in the latency numbers).
# An ALB would cost ~$18/month to expose an API with one demo client.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: orbiter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: orbiter:latest # kustomize rewrites to the ECR image@sha
          command:
            [
              "uvicorn",
              "orbiter.api.app:create_app",
              "--factory",
              "--host",
              "0.0.0.0",
              "--port",
              "8000",
            ]
          envFrom:
            - secretRef:
                name: orbiter-config
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
