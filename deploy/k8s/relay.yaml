apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: orbiter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
    spec:
      containers:
        - name: relay
          image: orbiter:latest
          command: ["python", "-m", "orbiter.relay.outbox_relay"]
          envFrom:
            - secretRef:
                name: orbiter-config
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 384Mi }
