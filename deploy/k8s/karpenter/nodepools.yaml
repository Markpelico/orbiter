# Two pools, spot-first with on-demand fallback. FREE-PLAN EDITION:
# the account only launches free-tier-eligible types (c7i-flex.large,
# m7i-flex.large, t3.small verified eligible) and carries 5-vCPU quotas for
# on-demand and spot separately. The limits below are the engineering answer:
# spot pool may hold 4 vCPUs (2 nodes), the on-demand fallback 2 vCPUs
# (1 node), which together with the 2-vCPU system node stays inside quota.
# Both pools label nodes orbiter/pool=workers — all the worker Deployment
# ever asks for.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: workers-spot
spec:
  weight: 100
  template:
    metadata:
      labels:
        orbiter/pool: workers
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: workers
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["c7i-flex.large", "m7i-flex.large", "t3.small"]
      expireAfter: 24h
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
  limits:
    cpu: "4" # 2 spot nodes max — inside the 5-vCPU spot quota
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: workers-fallback
spec:
  weight: 10
  template:
    metadata:
      labels:
        orbiter/pool: workers
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: workers
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["c7i-flex.large", "t3.small"]
      expireAfter: 24h
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
  limits:
    cpu: "2" # 1 fallback node — shares the on-demand quota with the system node
